services:
  agent:
    build:
      context: .
    container_name: mirrormemusic-agent
    volumes:
      - .:/workspace
      - claude-config:/home/node/.claude
      - bash-history:/home/node/.bash_history_dir
    working_dir: /workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    stdin_open: true
    tty: true
    network_mode: bridge

volumes:
  claude-config:
  bash-history:
